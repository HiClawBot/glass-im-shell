name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      GLASS_SMOKE_PORT_START: 5500
      GLASS_SMOKE_PORT_END: 5509
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Release audit
        run: npm run release:check

      - name: Browser smoke
        run: npm run smoke:playwright

      - name: Package preview
        run: npm pack --dry-run

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: output/smoke
          if-no-files-found: ignore
