<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Glass IM Shell</title>
  <desc id="desc">Original liquid-glass IM UI kit preview with mobile messaging, wallet, and host integration surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef6f2"/>
      <stop offset="0.52" stop-color="#dfeae5"/>
      <stop offset="1" stop-color="#c8d8d2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
